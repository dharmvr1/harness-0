[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ce-agent"
version = "0.1.0"
description = "Terminal-native coding agent (learning project): LLM tool loop that works in a git worktree + Docker sandbox."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ce-agent = "ce_agent.main:main"

[tool.setuptools.packages.find]
include = ["ce_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]